version: "3.8"

services:
  hiveserver2:
    image: apache/hive:4.0.0
    container_name: argus-hiveserver2
    ports:
      - "10000:10000"   # HiveServer2 Thrift
      - "10002:10002"   # HiveServer2 Web UI
    environment:
      SERVICE_NAME: hiveserver2
      # IS_RESUME must stay unset: fresh containers need the entrypoint to
      # run schematool -initSchema, or HiveServer2 loops without ever
      # opening the Thrift port.
      SERVICE_OPTS: >-
        -Dhive.server2.authentication=NOSASL
        -Dhive.server2.thrift.port=10000
    healthcheck:
      # First boot runs schematool -initSchema before HiveServer2 opens the
      # Thrift port: allow several minutes before giving up. auth=noSasl is
      # required — the server runs NOSASL and closes plain-SASL beeline
      # connections, so a URL without it can never turn healthy.
      test: ["CMD", "beeline", "-u", "jdbc:hive2://localhost:10000/default;auth=noSasl", "-e", "SELECT 1"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 120s

  # mem_limit keeps the JVM honest: the stock image uses
  # MaxRAMPercentage=80, which sizes the heap on the whole machine when
  # no cgroup limit is set — two Trino containers then overcommit small
  # CI runners at boot.
  trino:
    image: trinodb/trino:latest
    container_name: argus-trino
    mem_limit: 2g
    ports:
      - "8080:8080"
    healthcheck:
      # /v1/info answers 200 while the server is still starting; wait for
      # "starting":false or queries right after the healthcheck can fail.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # HTTPS on 8443 for the TLS tests. Internal/discovery stays on HTTP
  # inside the container (8080, not published): fully disabling HTTP
  # requires internal-TLS configuration and Trino refuses to start
  # ("internalUri is null"). Run tests/integration/certs/generate.sh
  # before bringing this service up.
  trino-ssl:
    image: trinodb/trino:latest
    container_name: argus-trino-ssl
    mem_limit: 2g
    ports:
      - "8443:8443"
    volumes:
      - ./certs/server.p12:/etc/trino/server.p12:ro
      - ./trino-ssl-config/config.properties:/etc/trino/config.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8443/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # apache/phoenix:5.2.0 does not exist on Docker Hub ("object not found"), and
  # Apache publishes no official Phoenix Query Server image. This community
  # all-in-one (HBase + Phoenix 5.0 + Query Server on 8765) is the viable one.
  #
  # NOTE: its PQS defaults to Avatica PROTOBUF serialization, but the Argus
  # phoenix backend speaks Avatica JSON. Point it at JSON before the driver can
  # connect — set phoenix.queryserver.serialization=JSON in the server's
  # hbase-site.xml (or start queryserver.py with
  # -Dphoenix.queryserver.serialization=JSON). Until a JSON-configured PQS is
  # wired up here, the phoenix dialect stays on the conservative ansi_fns table
  # (src/odbc/dialect.c) rather than a live-probed one.
  phoenix:
    image: boostport/hbase-phoenix-all-in-one:2.0-5.0
    container_name: argus-phoenix
    ports:
      - "8765:8765"     # Phoenix Query Server (Avatica)
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8765/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  kudu-master:
    image: apache/kudu:latest
    container_name: argus-kudu-master
    ports:
      - "7051:7051"     # Kudu Master RPC
      - "8051:8051"     # Kudu Master Web UI
    command: ["master"]
    environment:
      MASTER_ARGS: "--fs_wal_dir=/var/lib/kudu/master --webserver_doc_root=/opt/kudu/www"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kudu-tserver:
    image: apache/kudu:latest
    container_name: argus-kudu-tserver
    ports:
      - "7050:7050"     # Kudu Tablet Server RPC
      - "8050:8050"     # Kudu Tablet Server Web UI
    command: ["tserver"]
    environment:
      TSERVER_ARGS: "--fs_wal_dir=/var/lib/kudu/tserver --tserver_master_addrs=kudu-master:7051"
    depends_on:
      kudu-master:
        condition: service_healthy

  # ── Spark Thrift Server ────────────────────────────────────────────────
  # Spark's Thrift Server is HiveServer2-compatible; Argus reaches it through
  # the Hive backend. Exposed on host port 10010 to avoid clashing with the
  # Hive container on 10000. NOTE: template — the start command/options may need
  # tuning for the chosen Spark image version.
  spark-thrift:
    image: apache/spark:3.5.3
    container_name: argus-spark-thrift
    ports:
      - "10010:10000"   # Spark Thrift Server (HiveServer2 protocol)
    command: >-
      bash -c "/opt/spark/sbin/start-thriftserver.sh
      --master 'local[2]'
      --hiveconf hive.server2.thrift.port=10000
      --hiveconf hive.server2.authentication=NOSASL
      && tail -F /opt/spark/logs/*.out"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/10000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── Hive Metastore (standalone) ────────────────────────────────────────
  # Required by the Flink SQL Gateway's hiveserver2 endpoint ("Embedded
  # metastore is not allowed"). Derby-backed, throwaway.
  metastore:
    image: apache/hive:4.0.0
    container_name: argus-metastore
    environment:
      SERVICE_NAME: metastore

  # ── Flink SQL Gateway (HiveServer2 endpoint) ───────────────────────────
  # Validated live (2026-08): SELECT executes through a real Flink job.
  # The recipe that works, learned the hard way:
  #   - run tests/integration/flink-lib/fetch-jars.sh ONCE to download the
  #     hive connector + shaded-hadoop jars (mounted below);
  #   - the -java8 image: on JDK11 the hive connector dies with the
  #     URLClassLoader ClassCastException on the first query;
  #   - start-cluster.sh first: the gateway alone cannot run jobs
  #     ("Connection refused: 8081" without a JobManager);
  #   - the metastore URI must survive Hive's DNS canonicalization, which
  #     appends the docker network name — hence the explicit underscore-free
  #     network below ('_' is illegal in a URI hostname).
  flink-sql-gateway:
    image: flink:1.18.1-scala_2.12-java8
    container_name: argus-flink-sql-gateway
    depends_on:
      - metastore
    ports:
      - "10011:10000"   # SQL Gateway hiveserver2 endpoint
    volumes:
      - ./flink-lib/flink-sql-connector-hive-3.1.3_2.12-1.18.1.jar:/opt/flink/lib/flink-sql-connector-hive.jar:ro
      - ./flink-lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-uber.jar:ro
      - ./flink-lib/conf:/opt/flink/hive-conf:ro
    command: >-
      bash -c "/opt/flink/bin/start-cluster.sh &&
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.type=hiveserver2
      -Dsql-gateway.endpoint.hiveserver2.thrift.port=10000
      -Dsql-gateway.endpoint.hiveserver2.catalog.hive-conf-dir=/opt/flink/hive-conf"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/10000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ── MariaDB (MySQL-wire backend) ───────────────────────────────────────
  # The MySQL-wire backend (Backend=mysql) also serves StarRocks, Doris and
  # ClickHouse, which speak the same protocol. Seeded from ./mysql-init.
  mariadb:
    image: mariadb:11
    container_name: argus-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: testdb
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── InfluxDB 3 Core (Arrow Flight SQL backend) ─────────────────────────
  # Flight SQL on the HTTP/gRPC port 8181, auth disabled for tests. The
  # one-shot seed container below writes the "cpu" table into db "testdb".
  influxdb3:
    image: quay.io/influxdb/influxdb3-core:latest
    container_name: argus-influxdb3
    ports:
      - "8181:8181"
    command: >-
      serve --node-id node0 --object-store memory
      --without-auth --http-bind 0.0.0.0:8181

  influxdb3-seed:
    image: curlimages/curl:latest
    container_name: argus-influxdb3-seed
    depends_on:
      - influxdb3
    restart: "no"
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 30); do
          curl -fsS http://influxdb3:8181/health >/dev/null 2>&1 && break
          sleep 2
        done
        curl -sS "http://influxdb3:8181/api/v3/write_lp?db=testdb&precision=nanosecond" \
          --data-binary 'cpu,host=alpha,region=eu usage=0.5,cores=4i,label="prod" 1718000000000000000
        cpu,host=beta,region=us usage=0.7,cores=8i 1718000001000000000
        cpu,host=gamma,region=eu usage=0.9,cores=16i 1718000002000000000'

  # ── BigQuery emulator (goccy) ──────────────────────────────────────────
  # Exercises the BigQuery backend without GCP, and doubles as the test for
  # the configurable-endpoint requirement (BQEndpoint=http://localhost:9050,
  # the same mechanism sovereign-cloud deployments like S3NS rely on).
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    container_name: argus-bigquery
    command: ["--project=test", "--data-from-yaml=/seed.yaml", "--port=9050"]
    ports:
      - "9050:9050"
    volumes:
      - ./bigquery-seed.yaml:/seed.yaml:ro

  # Apache Pinot single-container QuickStart: brings up controller (9000) +
  # broker (8000) and batch-ingests the sample tables (baseballStats, ...).
  # The healthcheck waits until baseballStats is actually queryable.
  pinot:
    image: apachepinot/pinot:latest
    container_name: argus-pinot
    command: ["QuickStart", "-type", "batch"]
    ports:
      - "8000:8000"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -d '{\"sql\":\"SELECT COUNT(*) FROM baseballStats\"}' http://localhost:8000/query/sql 2>/dev/null | grep -q 'rows\":\\[\\[[1-9]'"]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 40s

  # ── Apache Druid (BACKEND=druid) ───────────────────────────────────────
  # The Druid backend had no compose service and no integration test, so its
  # query submission, its result parsing and the catalog SQL it writes were
  # only ever checked against strings in a unit test.
  #
  # The image runs one service per container, so the smallest stack that
  # answers SQL is four: ZooKeeper, a coordinator (which also hosts the Derby
  # metadata store), a historical, and the broker that serves /druid/v2/sql.
  # Heap sizes are cut well below the defaults -- these hold no data, they
  # only have to plan and answer.
  druid-zk:
    image: zookeeper:3.9
    container_name: argus-druid-zk
    environment:
      ZOO_MY_ID: "1"

  druid-coordinator:
    image: apache/druid:31.0.1
    container_name: argus-druid-coordinator
    command: coordinator
    depends_on:
      - druid-zk
    environment: &druid_env
      ZOOKEEPER: druid-zk:2181
      DRUID_XMS: 256m
      DRUID_XMX: 512m
      DRUID_MAXDIRECTMEMORYSIZE: 512m
      druid_zk_service_host: druid-zk
      druid_metadata_storage_type: derby
      druid_metadata_storage_connector_connectURI: jdbc:derby://druid-coordinator:1527/var/druid/metadata.db;create=true
      druid_metadata_storage_connector_host: druid-coordinator
      druid_metadata_storage_connector_port: "1527"
      druid_coordinator_balancer_strategy: cachingCost
      druid_storage_type: local
      druid_storage_storageDirectory: /opt/shared/segments
      druid_indexer_logs_type: file
      druid_indexer_logs_directory: /opt/shared/indexing-logs
      druid_extensions_loadList: '["druid-hdfs-storage"]'
      druid_processing_numThreads: "1"
      druid_processing_numMergeBuffers: "2"
      druid_processing_buffer_sizeBytes: "25000000"
      druid_server_maxSize: "1000000000"
      druid_emitter: noop

  druid-historical:
    image: apache/druid:31.0.1
    container_name: argus-druid-historical
    command: historical
    depends_on:
      - druid-coordinator
    environment: *druid_env

  druid-broker:
    image: apache/druid:31.0.1
    container_name: argus-druid-broker
    command: broker
    depends_on:
      - druid-coordinator
    environment: *druid_env
    ports:
      - "8082:8082"
    healthcheck:
      # /status/health answers before the broker can plan, so the check is a
      # query. The image ships busybox wget and no curl, which is why this
      # is not shaped like the others.
      test: ["CMD-SHELL", "wget -q -O - --header='Content-Type: application/json' --post-data='{\"query\":\"SELECT 1\"}' http://localhost:8082/druid/v2/sql | grep -q 1"]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 30s

  # ── PostgreSQL (BACKEND=postgres) ──────────────────────────────────────
  # Also the reference server for the PostgreSQL-family dialect probe:
  #   PG_HOST=127.0.0.1 PG_PORT=5432 ./test_postgres_escapes
  #   BI_BACKEND=postgres BI_HOST=127.0.0.1 BI_PORT=5432 BI_UID=argus \
  #     BI_PWD=argus BI_DATABASE=argusdb BI_TABLE=argus_test.nation \
  #     BI_TABLE2=argus_test.region ./test_bi_escapes
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argusdb
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argusdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Greenplum (BACKEND=greenplum) ──────────────────────────────────────
  # Behind a profile, so `docker compose up -d` never tries to start it and CI
  # never depends on it: there is no official, currently-maintained Greenplum
  # image. The open-source line was archived when Greenplum 7 moved behind a
  # commercial licence, and the community single-node images come and go.
  #
  # This entry is therefore a template, like the spark-thrift one above. Start
  # it with `docker compose --profile greenplum up -d`, and if the tag below no
  # longer pulls, point the tests at a real cluster instead:
  #   PG_BACKEND=greenplum PG_HOST=<coordinator> PG_PORT=5432 ./test_postgres_escapes
  greenplum:
    profiles: ["greenplum"]
    image: datagrip/greenplum:6.8
    container_name: argus-greenplum
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus

  # ── Apache Cloudberry (BACKEND=cloudberry) ─────────────────────────────
  # Same treatment and the same caveat: Cloudberry publishes container images
  # and a deploy/docker tree, but the tag is not pinned here because it has not
  # been verified from this repository. Start with
  # `docker compose --profile cloudberry up -d` after checking the tag, or
  # point PG_HOST at a real coordinator.
  cloudberry:
    profiles: ["cloudberry"]
    image: apache/cloudberry:latest
    container_name: argus-cloudberry
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus

# Explicit, underscore-free network name: the Hive metastore client
# canonicalizes thrift://host:port via reverse DNS, which appends the docker
# network name — and '_' (as in the default "integration_default") is illegal
# in a URI hostname, breaking the Flink gateway's metastore connection with
# "URISyntaxException: Illegal character in hostname".
networks:
  default:
    name: argusintegration
