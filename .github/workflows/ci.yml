name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # integration-full: on demand, and weekly (Monday 03:17 UTC)
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential \
            cmake \
            pkg-config \
            unixodbc-dev \
            libglib2.0-dev \
            libthrift-c-glib-dev \
            thrift-compiler \
            libcmocka-dev \
            libcurl4-openssl-dev \
            libjson-glib-dev \
            libmariadb-dev \
            libpq-dev \
            libkrb5-dev \
            locales

      # The locale tests switch LC_NUMERIC to a comma-decimal locale, the way
      # Excel and Tableau leave the process on a French or German desktop.
      - name: Generate a comma-decimal locale
        run: sudo locale-gen fr_FR.UTF-8

      # ARGUS_RELEASE=ON: every backend a release ships with must configure
      # here, so a broken dependency probe fails the PR, not the tag build.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="--coverage" -DARGUS_RELEASE=ON -DARGUS_WITH_GSSAPI=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit Tests
        env:
          ARGUS_TEST_REQUIRE_LOCALE: "1"
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.so \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry gssapi

      - name: Coverage report
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y lcov
          lcov --capture --directory build --output-file coverage.info --no-external
          lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: coverage.info
          fail_ci_if_error: false

      - name: Package tar.gz
        run: |
          mkdir -p staging/argus-odbc/lib
          mkdir -p staging/argus-odbc/include/argus
          cp build/src/libargus_odbc.so staging/argus-odbc/lib/
          cp include/argus/*.h staging/argus-odbc/include/argus/
          cp scripts/install_dsn.sh staging/argus-odbc/
          chmod +x staging/argus-odbc/install_dsn.sh
          tar -czf argus-odbc-linux-x64.tar.gz -C staging argus-odbc

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-linux
          path: argus-odbc-linux-x64.tar.gz

      - name: Install RPM tools
        run: sudo apt-get -o Acquire::Retries=5 install -y rpm

      - name: Package .deb
        run: bash packaging/build-deb.sh

      - name: Package .rpm
        run: bash packaging/build-rpm.sh

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-deb
          path: argus-odbc_*.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-rpm
          path: argus-odbc-*.rpm

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            pkg-config \
            unixodbc \
            glib \
            json-glib \
            curl \
            libpq \
            mariadb-connector-c \
            thrift \
            cmocka
          # libpq is keg-only: without this the pkg-config probe misses it and
          # the PostgreSQL backends are left out of the build. The last entry
          # is the thrift_c_glib runtime built below.
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mariadb-connector-c)/lib/pkgconfig:$PWD/thrift-c-glib-prefix/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Cache thrift_c_glib
        id: cache-thrift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: thrift-c-glib-prefix
          key: thrift-c-glib-0.23.0-macos-${{ runner.arch }}-v1

      - name: Build thrift_c_glib (portable subset)
        if: steps.cache-thrift.outputs.cache-hit != 'true'
        # Homebrew's thrift formula ships the compiler and the C++ runtime,
        # not c_glib; build the portable subset (Argus talks through its own
        # GIO transport). Without it the driver has no Hive/Impala, and
        # ARGUS_RELEASE=ON refuses to configure.
        run: bash scripts/build-thrift-c-glib.sh "$PWD/thrift-c-glib-prefix" 0.23.0

      # ARGUS_RELEASE=ON: every backend a release ships with must configure
      # here, so a broken dependency probe fails the PR, not the tag build.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DARGUS_RELEASE=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.dylib \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry

      - name: Package tar.gz
        run: |
          mkdir -p staging/argus-odbc/lib
          mkdir -p staging/argus-odbc/include/argus
          cp build/src/libargus_odbc.dylib staging/argus-odbc/lib/
          cp include/argus/*.h staging/argus-odbc/include/argus/
          cp scripts/install_dsn_macos.sh staging/argus-odbc/
          chmod +x staging/argus-odbc/install_dsn_macos.sh
          tar -czf argus-odbc-macos-$(uname -m).tar.gz -C staging argus-odbc

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-macos
          path: argus-odbc-macos-*.tar.gz

      - name: Package .pkg
        run: bash packaging/build-macos-pkg.sh

      - name: Upload .pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-pkg
          path: argus-odbc-*.pkg

  build-windows:
    runs-on: windows-latest
    environment: main

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-thrift
            mingw-w64-ucrt-x86_64-cmocka
            mingw-w64-ucrt-x86_64-nsis

      - name: Cache thrift_c_glib
        id: cache-thrift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: thrift-c-glib-prefix
          key: thrift-c-glib-0.23.0-ucrt64-v1

      - name: Build thrift_c_glib (portable subset)
        if: steps.cache-thrift.outputs.cache-hit != 'true'
        # MSYS2 ships the thrift compiler but not the c_glib runtime; build
        # the portable subset (Argus talks through its own GIO transport).
        run: bash scripts/build-thrift-c-glib.sh "$PWD/thrift-c-glib-prefix" 0.23.0

      # ARGUS_RELEASE=ON: every backend a release ships with must configure
      # here, so a broken dependency probe fails the PR, not the tag build.
      - name: Configure
        run: >-
          PKG_CONFIG_PATH="$PWD/thrift-c-glib-prefix/lib/pkgconfig"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARGUS_RELEASE=ON

      - name: Build
        run: cmake --build build

      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.dll \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry sspi

      - name: Prepare installer files
        run: |
          mkdir -p installer/staging/gio-modules
          cp build/src/libargus_odbc.dll installer/staging/argus_odbc.dll
          # GIO TLS backend for the Hive/Impala binary-Thrift transport;
          # loaded at runtime from gio-modules\ next to the driver DLL.
          cp "$MINGW_PREFIX/lib/gio/modules/libgioopenssl.dll" \
              installer/staging/gio-modules/
          # Bundle the transitive DLL closure; fails if anything is missing
          bash scripts/bundle_windows_dlls.sh "$MINGW_PREFIX/bin" \
              installer/staging installer/staging/argus_odbc.dll \
              installer/staging/gio-modules/libgioopenssl.dll
          # The installer shows and installs these; makensis reads them from
          # the staging directory it is run in.
          cp LICENSE NOTICE installer/staging/
          ls -la installer/staging/

      - name: Sign driver DLL
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7  # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: installer/staging
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build NSIS installer
        run: |
          cd installer/staging
          VERSION=$(grep 'project(argus VERSION' ../../CMakeLists.txt | sed 's/.*VERSION \([^ )]*\).*/\1/')
          makensis -NOCD -DVERSION=$VERSION ../argus-odbc.nsi

      - name: Sign installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7  # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: installer/staging
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-odbc-installer
          path: installer/staging/argus-odbc-installer.exe

  build-powerbi-connector:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Power Query SdkTools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ runner.temp }}\argus-pqsdk\sdktools-2.155.2.nupkg
          key: pq-sdktools-2.155.2

      # Compile Argus.pq with the real MakePQX toolchain so a broken connector
      # (M syntax / dialect regression) fails CI, mirroring the pqtest guard.
      - name: Compile the Power BI connector (.mez)
        shell: pwsh
        run: connectors/powerbi/build.ps1 -OutDir connector-dist -ToolsCacheDir "$env:RUNNER_TEMP\argus-pqsdk"

      - name: Upload connector (.mez)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-powerbi-connector
          path: connector-dist/Argus.mez

  build-tableau-connector:
    runs-on: ubuntu-latest

    # A .taco is a jar; Tableau verifies its signature. Signing runs only when
    # the code-signing keystore secret is present (PRs from forks do not see
    # it and still produce a loadable, unsigned .taco); once it is, a signing
    # failure fails the job rather than quietly uploading an unsigned jar.
    env:
      TACO_SIGN_ENABLED: ${{ secrets.TABLEAU_SIGN_KEYSTORE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Set up JDK (jarsigner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      # Schema-check the connector XML against Tableau's published XSDs. This is
      # the cheap guard that catches an invented element or attribute; a .taco
      # with bad XML simply never loads in Tableau, with no error to read.
      - name: Validate connector XML
        run: |
          pip install xmlschema
          python connectors/tableau/validate-xml.py

      # Package with Tableau's own tool so a structurally broken connector fails
      # CI. Unsigned: signing needs a public-CA code-signing keystore, which is
      # a release-time concern (see connectors/tableau/README.md).
      - name: Package the Tableau connectors (.taco)
        shell: pwsh
        run: connectors/tableau/build.ps1 -OutDir connector-dist

      # Sign each .taco with a public-CA code-signing cert + RFC-3161 timestamp
      # so Tableau accepts it without lowering its signature-verification level.
      - name: Sign the .taco connectors
        if: env.TACO_SIGN_ENABLED != ''
        env:
          TABLEAU_SIGN_KEYSTORE: ${{ secrets.TABLEAU_SIGN_KEYSTORE }}
          TABLEAU_SIGN_KEYSTORE_PASSWORD: ${{ secrets.TABLEAU_SIGN_KEYSTORE_PASSWORD }}
          TABLEAU_SIGN_ALIAS: ${{ secrets.TABLEAU_SIGN_ALIAS }}
        run: |
          echo "$TABLEAU_SIGN_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ks.p12"
          for taco in connector-dist/*.taco; do
            jarsigner -tsa http://timestamp.digicert.com \
              -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 \
              -storepass "$TABLEAU_SIGN_KEYSTORE_PASSWORD" \
              "$taco" "$TABLEAU_SIGN_ALIAS"
            jarsigner -verify -strict "$taco"
          done
          rm -f "$RUNNER_TEMP/ks.p12"

      - name: Upload connectors (.taco)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: argus-tableau-connectors
          path: connector-dist/*.taco

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential \
            cmake \
            pkg-config \
            unixodbc-dev \
            libglib2.0-dev \
            libthrift-c-glib-dev \
            thrift-compiler \
            libcmocka-dev \
            libcurl4-openssl-dev \
            libjson-glib-dev \
            libmariadb-dev \
            libpq-dev \
            libkrb5-dev

      - name: Generate TLS certificates
        run: bash tests/integration/certs/generate.sh

      - name: Start services
        # Bring up the services with working healthchecks and block until ready
        # (Pinot's healthcheck also waits for its sample-data ingestion).
        # trino-ssl starts in a second wave: booting two Trino JVMs plus the
        # Pinot quickstart at once overcommits the runner.
        run: |
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            mariadb postgres influxdb3 influxdb3-seed trino pinot bigquery
          # Druid is four containers (ZooKeeper, coordinator, historical,
          # broker) and none of them holds data; the backend had no
          # integration coverage at all before this.
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            druid-zk druid-coordinator druid-historical druid-broker
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            trino-ssl hiveserver2

      - name: Service diagnostics
        if: failure()
        run: |
          docker ps -a
          docker compose -f tests/integration/docker-compose.yml logs --tail 80 \
            trino-ssl trino pinot mariadb postgres hiveserver2 bigquery

      - name: Configure
        run: cmake -B build -DBUILD_INTEGRATION_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Integration Tests
        env:
          TRINO_HOST: localhost
          TRINO_PORT: "8080"
          TRINO_SSL_HOST: localhost
          TRINO_SSL_PORT: "8443"
          TRINO_SSL_CA_FILE: ${{ github.workspace }}/tests/integration/certs/ca-cert.pem
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          DRUID_HOST: "127.0.0.1"
          DRUID_PORT: "8082"
          PINOT_HOST: "127.0.0.1"
          PINOT_PORT: "8000"
          BQ_ENDPOINT: "http://127.0.0.1:9050"
          BQ_PROJECT: "test"
          HIVE_HOST: "127.0.0.1"
          HIVE_PORT: "10000"
          PG_HOST: "127.0.0.1"
          PG_PORT: "5432"
          PG_USER: "argus"
          PG_PASS: "argus"
          PG_DB: "argusdb"
        # Run the backends whose deps are installed here (Trino, MySQL-wire,
        # Pinot, BigQuery, PostgreSQL). Flight SQL / ADBC require Arrow and run
        # in their own setup. Greenplum and Cloudberry are behind compose
        # profiles and are not started here — see docker-compose.yml.
        run: cd build && ctest --output-on-failure -L integration -R "trino|mysql|pinot|druid|bigquery|postgres|hive_connect|hive_query|bi_folding"

      - name: Stop services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential \
            cmake \
            pkg-config \
            unixodbc-dev \
            libglib2.0-dev \
            libthrift-c-glib-dev \
            thrift-compiler \
            libcmocka-dev \
            libcurl4-openssl-dev \
            libjson-glib-dev \
            libmariadb-dev \
            libpq-dev \
            libkrb5-dev \
            locales

      - name: Generate a comma-decimal locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Configure (ASan + UBSan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp
          ARGUS_TEST_REQUIRE_LOCALE: "1"
        run: cd build-asan && ctest --output-on-failure -L unit

  # The Arrow Flight SQL backend is the one that no other job compiles:
  # arrow-flight-sql is not in Ubuntu, so every build above configures with it
  # DISABLED and a change to flightsql_*.cpp reached main having never been
  # through a compiler. This installs Arrow from the Apache repository and
  # builds that backend on its own, so it cannot silently rot.
  build-flightsql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Arrow Flight SQL and the driver's dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential cmake pkg-config unixodbc-dev \
            libglib2.0-dev libcmocka-dev libcurl4-openssl-dev \
            libjson-glib-dev ca-certificates lsb-release wget
          # Apache's own apt repository; libarrow-flight-sql-dev is in no
          # Ubuntu release. The apt-source package registers it and pins its
          # signing key.
          wget -q --tries=3 \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb" \
            -O /tmp/apache-arrow-apt-source.deb
          sudo apt-get -o Acquire::Retries=5 install -y \
            /tmp/apache-arrow-apt-source.deb
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            libarrow-dev libarrow-flight-dev libarrow-flight-sql-dev

      # ARGUS_WITH_FLIGHTSQL=ON makes a missing dependency an error rather
      # than a backend quietly left out -- which is the whole point here.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DARGUS_WITH_FLIGHTSQL=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        run: cd build && ctest --output-on-failure -L unit

  # Coverage-guided fuzzing over the hand-written parsers (escape translator,
  # connection-string parser). Short deterministic budget per push; crashes
  # are uploaded as artifacts. Run locally with fuzz/README-worthy one-liners
  # in each harness header.
  fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            clang libclang-rt-dev build-essential cmake pkg-config \
            unixodbc-dev libglib2.0-dev libcurl4-openssl-dev \
            libjson-glib-dev libmariadb-dev libcmocka-dev

      - name: Configure (libFuzzer + ASan)
        run: CC=clang CXX=clang++ cmake -B build-fuzz -DENABLE_FUZZING=ON -DBUILD_ADBC=OFF

      - name: Build
        run: cmake --build build-fuzz -j$(nproc)

      - name: Fuzz escape translator
        run: ./build-fuzz/fuzz/fuzz_escape fuzz/corpus/escape -max_total_time=90 -print_final_stats=1

      - name: Fuzz connection-string parser
        run: ./build-fuzz/fuzz/fuzz_connstr fuzz/corpus/connstr -max_total_time=60 -print_final_stats=1

      # The Trino fast path scans a result page straight off the socket with
      # pointer arithmetic and no JSON library in the way, so everything it
      # reads comes from whatever answered on the coordinator's port.
      - name: Fuzz Trino result-page scanner
        run: ./build-fuzz/fuzz/fuzz_trino_json fuzz/corpus/trino_json -max_total_time=90 -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            oom-*

  # The FULL integration matrix — every compose service, every integration
  # test, sanitizers included. Too heavy for every push, so it runs on demand
  # (workflow_dispatch) and weekly; this is the job to run on an
  # integration-capable environment before a release.
  integration-full:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential cmake pkg-config unixodbc-dev libglib2.0-dev \
            libthrift-c-glib-dev thrift-compiler libcmocka-dev \
            libcurl4-openssl-dev libjson-glib-dev libmariadb-dev libkrb5-dev

      - name: Generate TLS certs (trino-ssl)
        run: bash tests/integration/certs/generate.sh
      - name: Fetch Flink gateway jars (sha256-pinned)
        run: bash tests/integration/flink-lib/fetch-jars.sh
      - name: Start every compose service
        run: |
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            mariadb influxdb3 influxdb3-seed trino pinot bigquery
          # Druid is four containers (ZooKeeper, coordinator, historical,
          # broker) and none of them holds data, so it starts with the light
          # wave rather than the heavy JVM one.
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            druid-zk druid-coordinator druid-historical druid-broker
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            trino-ssl hiveserver2
          # Second wave: the heavy JVM services, sequenced to avoid runner
          # overcommit. Spark and Flink (metastore-backed) are validated
          # recipes; Phoenix stays best-effort (the only available image
          # serves Avatica PROTOBUF while the driver speaks JSON — confirmed
          # live) and Kudu is deprecated (image refuses its own default
          # unsafe flags; backend unbuildable on current distros).
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            spark-thrift metastore flink-sql-gateway
          docker compose -f tests/integration/docker-compose.yml up -d --wait \
            phoenix kudu-master kudu-tserver || true

      - name: Configure
        run: cmake -B build -DBUILD_INTEGRATION_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Full integration suite
        env:
          TRINO_HOST: localhost
          TRINO_PORT: "8080"
          TRINO_SSL_HOST: localhost
          TRINO_SSL_PORT: "8443"
          TRINO_SSL_CA_FILE: ${{ github.workspace }}/tests/integration/certs/ca-cert.pem
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          DRUID_HOST: "127.0.0.1"
          DRUID_PORT: "8082"
          PINOT_HOST: "127.0.0.1"
          PINOT_PORT: "8000"
          BQ_ENDPOINT: "http://127.0.0.1:9050"
          BQ_PROJECT: "test"
          HIVE_HOST: "127.0.0.1"
          HIVE_PORT: "10000"
          PHOENIX_HOST: "127.0.0.1"
          KUDU_HOST: "127.0.0.1"
          SPARK_HOST: "127.0.0.1"
          SPARK_PORT: "10010"
          FLINK_HOST: "127.0.0.1"
          FLINK_PORT: "10011"
        # Phoenix and Kudu tests are excluded until their infra blockers land
        # (JSON-serialization PQS image; a bootable Kudu image) — see the
        # comments in docker-compose.yml.
        run: cd build && ctest --output-on-failure -L integration -E "phoenix|kudu"

      - name: Service diagnostics
        if: failure()
        run: |
          docker ps -a
          docker compose -f tests/integration/docker-compose.yml logs --tail 120

      - name: Stop services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down
