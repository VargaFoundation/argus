name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    # Package signing runs only when the GPG secret is configured. Once it
    # is, a signing failure fails the release: an expired key must be fixed,
    # not silently shipped around as unsigned packages under a green tag.
    # (Same policy for the Apple and Azure signing below.)
    env:
      GPG_SIGN_ENABLED: ${{ secrets.GPG_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get -o Acquire::Retries=5 install -y \
            build-essential \
            cmake \
            pkg-config \
            unixodbc-dev \
            libglib2.0-dev \
            libthrift-c-glib-dev \
            thrift-compiler \
            libcmocka-dev \
            libcurl4-openssl-dev \
            libjson-glib-dev \
            libmariadb-dev \
            libpq-dev \
            libkrb5-dev

      # ARGUS_RELEASE=ON turns a missing -dev package into a configure error
      # instead of a driver that quietly ships without that backend.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DARGUS_RELEASE=ON -DARGUS_WITH_GSSAPI=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.so \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry gssapi

      # ctest above already ran these for whatever the configure step decided;
      # this asserts what a release must be regardless: SQL*-only exports and
      # every hardening property including FORTIFY (--release).
      - name: Check exports and hardening
        run: |
          bash scripts/check-exports.sh build/src/libargus_odbc.so
          bash scripts/check-hardening.sh build/src/libargus_odbc.so --release

      - name: Package tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging/argus-odbc/lib
          mkdir -p staging/argus-odbc/include/argus
          cp build/src/libargus_odbc.so staging/argus-odbc/lib/
          cp include/argus/*.h staging/argus-odbc/include/argus/
          cp scripts/install_dsn.sh staging/argus-odbc/
          chmod +x staging/argus-odbc/install_dsn.sh
          cp LICENSE NOTICE staging/argus-odbc/
          cp README.md staging/argus-odbc/
          tar -czf argus-odbc-${VERSION}-linux-x64.tar.gz -C staging argus-odbc

      - name: Install RPM tools
        run: sudo apt-get -o Acquire::Retries=5 install -y rpm

      - name: Package .deb
        run: bash packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Package .rpm
        run: bash packaging/build-rpm.sh "${GITHUB_REF_NAME#v}"

      - name: Import GPG signing key
        if: env.GPG_SIGN_ENABLED != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
          gpg --list-secret-keys --keyid-format=long

      # rpmsign embeds a V4 RSA header signature. That is what `rpm -K` and
      # dnf/yum's gpgcheck validate; the header carries the payload digest, so
      # signing the header covers the payload too.
      - name: Sign .rpm
        if: env.GPG_SIGN_ENABLED != ''
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          cat > "$HOME/.rpmmacros" <<MACROS
          %_gpg_name $GPG_KEY_ID
          %__gpg /usr/bin/gpg
          %_gpg_digest_algo sha256
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/gpg-pass --digest-algo sha256 -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          MACROS
          rpmsign --addsign argus-odbc-*.rpm
          # Verify against a private rpm database owned by this user. On
          # Ubuntu rpm has no /var/lib/rpm, so it keeps its keyring per user:
          # a `sudo rpm --import` lands in root's database and a non-root
          # `rpm -K` reports NOKEY (the first v0.6.1 run failed that way).
          set -o pipefail
          gpg --armor --export "$GPG_KEY_ID" > "$RUNNER_TEMP/argus-pub.asc"
          rpmdb="$RUNNER_TEMP/rpmdb"
          rpm --define "_dbpath $rpmdb" --initdb
          rpm --define "_dbpath $rpmdb" --import "$RUNNER_TEMP/argus-pub.asc"
          rpm --define "_dbpath $rpmdb" -K -v argus-odbc-*.rpm | tee "$RUNNER_TEMP/rpm-verify.txt"
          # `rpm -K` exits 0 for an unsigned package (digests alone are OK):
          # require the header signature line itself.
          grep -q 'Signature, key ID .*: OK' "$RUNNER_TEMP/rpm-verify.txt"

      # Debian dropped dpkg-sig after bullseye and apt has never verified
      # signatures embedded in a .deb -- repository InRelease signing is the
      # supported trust path there. For a direct download we ship a detached
      # signature beside each artifact instead, verifiable with `gpg --verify`.
      - name: Sign .deb and tarball (detached)
        if: env.GPG_SIGN_ENABLED != ''
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          for f in argus-odbc_*.deb argus-odbc-*-linux-x64.tar.gz; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file "$RUNNER_TEMP/gpg-pass" \
                -u "$GPG_KEY_ID" --armor --detach-sign "$f"
            gpg --verify "$f.asc" "$f"
          done

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-linux
          path: |
            argus-odbc-*-linux-x64.tar.gz
            argus-odbc-*-linux-x64.tar.gz.asc

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-deb
          path: |
            argus-odbc_*.deb
            argus-odbc_*.deb.asc

      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-rpm
          path: argus-odbc-*.rpm

  build-macos:
    runs-on: macos-latest

    # Signing + notarization run only when the Apple secrets are configured;
    # once they are, a failure fails the release rather than publishing an
    # unsigned .pkg under a green tag.
    env:
      NOTARIZE_ENABLED: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            pkg-config \
            unixodbc \
            glib \
            json-glib \
            curl \
            libpq \
            mariadb-connector-c \
            thrift \
            cmocka
          # libpq is keg-only: without this the pkg-config probe misses it and
          # the PostgreSQL backends are left out of the build. The last entry
          # is the thrift_c_glib runtime built below.
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mariadb-connector-c)/lib/pkgconfig:$PWD/thrift-c-glib-prefix/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Cache thrift_c_glib
        id: cache-thrift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: thrift-c-glib-prefix
          key: thrift-c-glib-0.23.0-macos-${{ runner.arch }}-v1

      - name: Build thrift_c_glib (portable subset)
        if: steps.cache-thrift.outputs.cache-hit != 'true'
        # Homebrew's thrift formula ships the compiler and the C++ runtime,
        # not c_glib; build the portable subset (Argus talks through its own
        # GIO transport). Without it the driver has no Hive/Impala, and
        # ARGUS_RELEASE=ON refuses to configure.
        run: bash scripts/build-thrift-c-glib.sh "$PWD/thrift-c-glib-prefix" 0.23.0

      # ARGUS_RELEASE=ON turns a missing dependency into a configure error
      # instead of a driver that quietly ships without that backend.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DARGUS_RELEASE=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.dylib \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry

      - name: Check exports and hardening
        run: |
          bash scripts/check-exports.sh build/src/libargus_odbc.dylib
          bash scripts/check-hardening.sh build/src/libargus_odbc.dylib --release

      - name: Package tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          mkdir -p staging/argus-odbc/lib
          mkdir -p staging/argus-odbc/include/argus
          cp build/src/libargus_odbc.dylib staging/argus-odbc/lib/
          cp include/argus/*.h staging/argus-odbc/include/argus/
          cp scripts/install_dsn_macos.sh staging/argus-odbc/
          chmod +x staging/argus-odbc/install_dsn_macos.sh
          cp LICENSE NOTICE staging/argus-odbc/
          cp README.md staging/argus-odbc/
          tar -czf argus-odbc-${VERSION}-macos-${ARCH}.tar.gz -C staging argus-odbc

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-macos
          path: argus-odbc-*-macos-*.tar.gz

      # Import the Developer ID Application + Installer certs into a throwaway
      # keychain so codesign/productsign can find them.
      - name: Import Apple signing identity
        if: env.NOTARIZE_ENABLED != ''
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/argus.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # Sign the dylib before packaging so the .pkg contains a signed binary.
      - name: Codesign the driver
        if: env.NOTARIZE_ENABLED != ''
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGN_IDENTITY" build/src/libargus_odbc.dylib

      - name: Package .pkg
        run: bash packaging/build-macos-pkg.sh "${GITHUB_REF_NAME#v}"

      # Sign the installer, submit to Apple notary, staple the ticket. The
      # stapled .pkg installs without a Gatekeeper prompt on end-user Macs.
      - name: Sign + notarize + staple the .pkg
        if: env.NOTARIZE_ENABLED != ''
        env:
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          PKG=$(ls argus-odbc-*.pkg | head -1)
          productsign --sign "$APPLE_INSTALLER_IDENTITY" "$PKG" "signed-$PKG"
          mv "signed-$PKG" "$PKG"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"

      - name: Upload .pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-pkg
          path: argus-odbc-*.pkg

  build-windows:
    runs-on: windows-latest
    environment: main

    env:
      # Sign whenever the Azure secret is configured; a broken certificate
      # then fails the release instead of shipping an unsigned installer.
      SIGN_ENABLED: ${{ secrets.AZURE_SIGNING_ACCOUNT }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-thrift
            mingw-w64-ucrt-x86_64-cmocka
            mingw-w64-ucrt-x86_64-nsis

      - name: Cache thrift_c_glib
        id: cache-thrift
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: thrift-c-glib-prefix
          key: thrift-c-glib-0.23.0-ucrt64-v1

      - name: Build thrift_c_glib (portable subset)
        if: steps.cache-thrift.outputs.cache-hit != 'true'
        # MSYS2 ships the thrift compiler but not the c_glib runtime; build
        # the portable subset (Argus talks through its own GIO transport).
        run: bash scripts/build-thrift-c-glib.sh "$PWD/thrift-c-glib-prefix" 0.23.0

      # ARGUS_RELEASE=ON turns a missing dependency into a configure error
      # instead of a driver that quietly ships without that backend.
      - name: Configure
        run: >-
          PKG_CONFIG_PATH="$PWD/thrift-c-glib-prefix/lib/pkgconfig"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARGUS_RELEASE=ON

      - name: Build
        run: cmake --build build

      - name: Unit Tests
        run: cd build && ctest --output-on-failure -L unit

      - name: Verify the shipped backends
        run: |
          bash scripts/check-build-manifest.sh build/src/libargus_odbc.dll \
            hive impala trino phoenix pinot druid bigquery mysql \
            postgres greenplum cloudberry sspi

      - name: Check exports and hardening
        run: |
          bash scripts/check-exports.sh build/src/libargus_odbc.dll
          bash scripts/check-hardening.sh build/src/libargus_odbc.dll --release

      - name: Prepare installer files
        run: |
          mkdir -p installer/staging/gio-modules
          cp build/src/libargus_odbc.dll installer/staging/argus_odbc.dll
          # GIO TLS backend for the Hive/Impala binary-Thrift transport;
          # loaded at runtime from gio-modules\ next to the driver DLL.
          cp "$MINGW_PREFIX/lib/gio/modules/libgioopenssl.dll" \
              installer/staging/gio-modules/
          # Bundle the transitive DLL closure; fails if anything is missing
          bash scripts/bundle_windows_dlls.sh "$MINGW_PREFIX/bin" \
              installer/staging installer/staging/argus_odbc.dll \
              installer/staging/gio-modules/libgioopenssl.dll
          # The installer shows and installs these; makensis reads them from
          # the staging directory it is run in.
          cp LICENSE NOTICE installer/staging/

      - name: Sign driver DLL
        if: env.SIGN_ENABLED != ''
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7  # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: installer/staging
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build NSIS installer
        run: |
          cd installer/staging
          makensis -NOCD -DVERSION=${GITHUB_REF_NAME#v} ../argus-odbc.nsi

      - name: Sign installer
        if: env.SIGN_ENABLED != ''
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7  # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: installer/staging
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rename installer with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp installer/staging/argus-odbc-installer.exe argus-odbc-${VERSION}-windows-x64-installer.exe

      - name: Package Intune .intunewin
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME" -replace '^v',''
          # Copy Intune scripts into staging
          Copy-Item installer/intune/*.ps1 installer/staging/
          # Download IntuneWinAppUtil
          $intuneToolUrl = "https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe"
          Invoke-WebRequest -Uri $intuneToolUrl -OutFile IntuneWinAppUtil.exe
          # Generate .intunewin package
          .\IntuneWinAppUtil.exe -c installer\staging -s argus-odbc-installer.exe -o . -q
          # Rename with version
          Move-Item argus-odbc-installer.intunewin "argus-odbc-${VERSION}-windows-x64.intunewin"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-windows
          path: |
            argus-odbc-*-windows-x64-installer.exe
            argus-odbc-*-windows-x64.intunewin

  build-powerbi-connector:
    runs-on: windows-latest
    environment: main

    env:
      # Power BI connector signing is deliberately separate from the driver's
      # Azure Trusted Signing: MakePQX signs a .pqx only with a .pfx certificate
      # and has no Trusted Signing / Key Vault path. With no cert configured the
      # build produces an unsigned Argus.mez only.
      PQ_SIGNING_CERT_BASE64: ${{ secrets.PQ_SIGNING_CERT_BASE64 }}
      PQ_SIGNING_CERT_PASSWORD: ${{ secrets.PQ_SIGNING_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Cache Power Query SdkTools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ runner.temp }}\argus-pqsdk\sdktools-2.155.2.nupkg
          key: pq-sdktools-2.155.2

      - name: Build and sign the Power BI connector
        shell: pwsh
        run: connectors/powerbi/build.ps1 -OutDir connector-dist -ToolsCacheDir "$env:RUNNER_TEMP\argus-pqsdk"

      - name: Upload connector
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-powerbi
          if-no-files-found: warn
          path: |
            connector-dist/Argus.mez
            connector-dist/Argus.pqx
            connector-dist/Argus.pqx.thumbprint.txt

  release:
    needs: [build-linux, build-macos, build-windows, build-powerbi-connector]
    runs-on: ubuntu-latest

    # id-token and attestations are what actions/attest-build-provenance
    # needs to mint a signed statement tying these artefacts to this
    # workflow, this commit and this runner. contents: write is the release
    # itself; the workflow-level default only grants that one.
    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      GPG_SIGN_ENABLED: ${{ secrets.GPG_PRIVATE_KEY }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # Every platform artefact must be present before anything is published:
      # a job that uploaded nothing (if-no-files-found defaults to warn) must
      # not turn into a release with a hole in it.
      - name: Check that every artefact is present
        run: |
          cd artifacts
          missing=0
          for pattern in 'argus-odbc-*-linux-x64.tar.gz' 'argus-odbc_*.deb' \
                         'argus-odbc-*.rpm' 'argus-odbc-*-macos-*.tar.gz' \
                         'argus-odbc-*.pkg' 'argus-odbc-*-windows-x64-installer.exe' \
                         'argus-odbc-*-windows-x64.intunewin' 'Argus.mez'; do
            # shellcheck disable=SC2086
            if ! ls $pattern >/dev/null 2>&1; then
              echo "MISSING: $pattern"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # What is actually inside the binaries. The driver links GLib,
      # json-glib, libcurl, Thrift, MariaDB Connector/C, libpq and Kerberos,
      # several of them LGPL, and until now a recipient had no machine-
      # readable way to know which versions -- NOTICE says what, not which.
      # Generated before the checksums so the manifest and its GPG signature
      # cover the SBOM too.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/argus-odbc-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # One manifest covering every published file. This is the verification
      # path that works the same on every platform, including the ones whose
      # native signing is unavailable (an unsigned .pkg still gets a checksum
      # a user can verify against the signed manifest).
      - name: Checksum the artefacts
        run: |
          cd artifacts
          # Checksum the payloads, not the detached signatures beside them.
          find . -maxdepth 1 -type f ! -name '*.asc' ! -name 'SHA256SUMS*' \
            -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          [ -s SHA256SUMS ]
          sha256sum -c SHA256SUMS

      - name: Sign the manifest
        if: env.GPG_SIGN_ENABLED != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          cd artifacts
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$RUNNER_TEMP/gpg-pass" \
              -u "$GPG_KEY_ID" --armor --detach-sign SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      # A signed statement tying every artefact in the manifest to this
      # workflow, commit and runner, verifiable with:
      #   gh attestation verify <file> --repo VargaFoundation/argus
      # The GPG signature says the manifest came from the maintainer; this
      # says the binaries came out of this build and not off someone's
      # laptop.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/argus-odbc-*
            artifacts/argus-odbc_*
            artifacts/Argus.mez
            artifacts/Argus.pqx
            artifacts/Argus.pqx.thumbprint.txt
            artifacts/*.spdx.json
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
